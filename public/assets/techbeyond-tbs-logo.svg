<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 560" role="img" aria-label="Tech Beyond Solution TBS logo">
  <defs>
    <style>
      .brand-text {
        fill: #007fc5;
        font-family: "Poppins", "Segoe UI", Arial, sans-serif;
        font-weight: 700;
        letter-spacing: 0.2px;
      }
      .divider {
        stroke: #07a0db;
        stroke-width: 8;
      }
      .tbs {
        fill: #f2f2f2;
        font-family: "Poppins", "Segoe UI", Arial, sans-serif;
        font-weight: 800;
      }
    </style>
  </defs>

  <g transform="translate(48 86)">
    <text class="brand-text" x="0" y="88" font-size="126">Tech</text>
    <text class="brand-text" x="0" y="250" font-size="126">Beyond</text>
    <text class="brand-text" x="0" y="412" font-size="126">Solution</text>
  </g>

  <line class="divider" x1="760" y1="50" x2="760" y2="510" />

  <g transform="translate(850 72)">
    <polygon points="0,150 430,70 590,430 160,510" fill="#19baf0"/>
    <polygon points="300,0 760,40 740,400 340,350" fill="#f3f000"/>
    <polygon points="320,0 690,90 660,390 390,350" fill="#6dcb78"/>
    <polygon points="320,80 560,80 650,350 410,390" fill="#118fc0"/>
    <text class="tbs" x="150" y="300" font-size="238">TBS</text>
  </g>
</svg>
